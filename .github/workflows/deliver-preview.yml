name: Deliver installable APK
on:
  push:
    branches: [feat/pokopia-android]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: deliver-preview
  cancel-in-progress: true
jobs:
  deliver:
    if: github.ref == 'refs/heads/feat/pokopia-android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build installable ARM64 preview
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify APK
        id: verify_apk
        run: |
          exec > >(tee verify-apk.log) 2>&1
          python3 tool/verify_arm64.py build/app/outputs/flutter-apk/app-debug.apk --debug
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/aapt2" dump badging build/app/outputs/flutter-apk/app-debug.apk | tee apk-badging.txt | grep "application-label:'포코피아 서식지 도감'"
          cp build/app/outputs/flutter-apk/app-debug.apk pokopia-habitat-guide-arm64-preview.apk
          sha256sum pokopia-habitat-guide-arm64-preview.apk > pokopia-habitat-guide-arm64-preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pokopia-habitat-guide-installable-arm64
          path: |
            pokopia-habitat-guide-arm64-preview.apk
            pokopia-habitat-guide-arm64-preview.apk.sha256
      - name: Create and merge validated PR
        id: merge_pr
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/pr-body.md <<'BODY'
          포코피아 서식지 도감 Android 앱을 추가합니다. 검색/타입 필터, 서식지·출현 조건 상세 화면, 오프라인 캐시 및 새로운 책·잎 아이콘을 제공합니다.

          이 워크플로에서 flutter analyze, flutter test, ARM64 debug APK 빌드, ABI/서명/앱 이름 검사를 통과한 커밋만 merge합니다. 다운로드 APK는 Android debug 키로 서명된 테스트용 사전 릴리즈이며 정식 배포 키를 사용하지 않습니다. 실제 Android 기기 테스트는 별도로 필요합니다.
          BODY
          PR=$(gh pr list --base main --head feat/pokopia-android --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base main --head feat/pokopia-android --title '포코피아 서식지 도감 앱 및 APK 다운로드 추가' --body-file /tmp/pr-body.md 2>&1 | tee pr-delivery.log
            PR=$(gh pr list --base main --head feat/pokopia-android --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$PR" --squash --match-head-commit "$VALIDATED_SHA" 2>&1 | tee -a pr-delivery.log
          MERGED_SHA=$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid')
          test -n "$MERGED_SHA"
          echo "MERGED_SHA=$MERGED_SHA" >> "$GITHUB_ENV"
      - name: Publish downloadable APK prerelease
        if: always() && steps.verify_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'BODY'
          ## 포코피아 서식지 도감

          아래 Assets의 `pokopia-habitat-guide-arm64-preview.apk`를 ARM64 Android 휴대전화에서 내려받아 설치하세요. Android 설정에서 해당 브라우저/파일 앱의 '알 수 없는 앱 설치' 허용이 필요할 수 있습니다.

          이름/번호 검색, 타입 필터, 서식지·날씨·출현 시간, 오프라인 텍스트 캐시를 제공합니다. 첫 데이터 로딩에는 인터넷이 필요합니다.

          **테스트용 APK**: Android debug 키로 서명한 사전 릴리즈입니다. 정식 배포 서명 키를 사용하지 않으며 다음 빌드와 서명이 달라질 수 있어 재설치가 필요할 수 있습니다. 실제 기기 동작은 추가 검증이 필요합니다.

          검증: Flutter 정적 분석, 자동 테스트, ARM64 빌드, APK 서명·ABI·앱 이름 검사. `.sha256` 파일로 다운로드 무결성을 확인할 수 있습니다.
          BODY
          if [ -z "${MERGED_SHA:-}" ]; then
            echo 'PR merge는 저장소 권한/규칙으로 완료되지 않아 검증한 기능 브랜치 커밋의 미리보기 APK를 제공합니다.' >> /tmp/release-notes.md
          fi
          gh release create v1.0.0-preview.1 pokopia-habitat-guide-arm64-preview.apk pokopia-habitat-guide-arm64-preview.apk.sha256 --prerelease --target "${MERGED_SHA:-$GITHUB_SHA}" --title '포코피아 서식지 도감 · APK 미리보기' --notes-file /tmp/release-notes.md
      - name: Save delivery diagnostics
        if: always()
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          parts = ['Validated commit: ' + os.environ['VALIDATED_SHA']]
          for name in ['verify-apk.log', 'apk-badging.txt', 'pr-delivery.log']:
              path = pathlib.Path(name)
              if path.exists():
                  parts += ['\n### ' + name, path.read_text()[-30000:]]
          pathlib.Path('delivery-report.txt').write_text('\n'.join(parts))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan delivery-diagnostics
          git rm -rf --cached .
          git add delivery-report.txt
          git commit -m "Record APK delivery diagnostics for $VALIDATED_SHA"
          git push origin HEAD:refs/heads/ci/delivery --force
